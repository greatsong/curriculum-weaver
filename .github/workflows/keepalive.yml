name: Supabase Keepalive

# Supabase Free 플랜은 7일 비활성 시 프로젝트를 자동 일시정지(pause)함.
# /api/keepalive 가 curriculum_standards 테이블에서 실제 행을 읽어 활동 카운터를 리셋한다.
# 주 2회(월·목) 호출 — 최대 간격 4일로 7일 임계치에 여유를 둔다.
# (구 '0 3 */5 * *'는 매월 1·6·11·16·21·26일이라 31일 달은 26→1일이 6일 간격이었고,
#  GitHub 스케줄 지연까지 겹치면 마진이 사라졌음)

on:
  schedule:
    - cron: '0 3 * * 1,4'  # UTC 03:00 월·목 (KST 12:00)
  workflow_dispatch:        # 수동 트리거 허용

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/keepalive
        run: |
          URL="https://curriculum-weaver-server-production.up.railway.app/api/keepalive"
          for i in 1 2 3; do
            echo "Attempt $i"
            RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}\n" --max-time 30 "$URL") || true
            echo "$RESPONSE"
            STATUS=$(echo "$RESPONSE" | grep "^HTTP_STATUS:" | cut -d: -f2)
            if [ "$STATUS" = "200" ]; then
              echo "OK"
              exit 0
            fi
            sleep 20
          done
          echo "Keepalive failed after 3 attempts"
          exit 1
