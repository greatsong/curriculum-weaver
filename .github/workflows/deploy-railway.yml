name: Deploy to Railway

on:
  push:
    branches: [main]
  # 수동 재배포 — 코드 변경 없이 서버만 다시 띄워야 할 때 (예: curriculum_links 상태를
  # DB에서 직접 바꾼 뒤. linkService는 부팅 때 한 번만 하이드레이션하므로 재부팅이 필요하다)
  #   gh workflow run deploy-railway.yml -f reason="링크 강등 반영"
  workflow_dispatch:
    inputs:
      reason:
        description: '재배포 사유 (실행 이력에 남김)'
        required: false
        default: 'DB 변경 반영을 위한 재하이드레이션'

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # 배포는 한 번에 하나씩 순서대로 — 머지가 연달아 들어와도 railway up이 겹치지 않게 한다.
    # 실행 중인 배포는 끝까지 두고(cancel-in-progress: false), 기다리는 배포는 가장 최근 것 하나만 남는다
    # (그 커밋이 앞 커밋의 변경을 모두 담고 있다). 2026-10-19: 두 배포가 겹쳐 앞 빌드가 Railway에서 취소된 뒤
    # railway up이 끝나지 않고 71분 멈춘 일이 있었다.
    concurrency:
      group: railway-deploy-production
      cancel-in-progress: false
    # 정상 배포는 3~5분. 빌드가 취소돼도 CLI가 기다리기만 하는 경우를 20분에서 끊는다(기본값은 6시간)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      # OpenAI 키(임베딩·시맨틱 검색)를 Railway 변수와 동기화 — secret이 비어 있으면 건너뜀
      # (secrets 컨텍스트는 step if에서 못 쓰므로 env로 옮겨 검사)
      - name: Sync OPENAI_API_KEY to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "OPENAI_API_KEY secret 없음 — 동기화 건너뜀"; exit 0; fi
          railway variables --service curriculum-weaver-server --set "OPENAI_API_KEY=$OPENAI_API_KEY" --skip-deploys

      - name: Deploy to Railway
        run: railway up --service curriculum-weaver-server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
