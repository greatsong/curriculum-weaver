name: Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      # OpenAI 키(임베딩·시맨틱 검색)를 Railway 변수와 동기화 — GitHub secret에 있을 때만
      - name: Sync OPENAI_API_KEY to Railway
        if: ${{ secrets.OPENAI_API_KEY != '' }}
        run: railway variables --service curriculum-weaver-server --set "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" --skip-deploys
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to Railway
        run: railway up --service curriculum-weaver-server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
