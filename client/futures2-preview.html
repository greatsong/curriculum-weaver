<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>미래보기(타임스톤) · 애니메이션 미리보기</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif; }
    .preview-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 20px 0 6px; }
    .preview-tools button, .preview-tools select { color: #bdcfc7; background: #0b1714; border: 1px solid #314e41; border-radius: 9px; padding: 8px 11px; font: inherit; font-size: 12px; cursor: pointer; }
    .preview-tools button.on { color: #9fe4be; border-color: #729882; }
    .preview-tools label { color: #91a499; font-size: 12px; display: flex; align-items: center; gap: 5px; }
    .preview-note { color: #758e83; font-size: 12px; line-height: 1.6; }
    #feedback { min-height: 20px; color: #b2dbc3; font-size: 13px; }
  </style>
</head>
<body class="futures2-root">
  <canvas class="fu-dust" aria-hidden="true"></canvas>
  <main class="fu-main">
    <header class="fu-header"><div><h1>미래보기(타임스톤)</h1><p class="fu-sub">여섯 개의 성취기준이 연결되고, 시간의 고리를 통해 수업의 가능성이 열립니다.</p></div></header>
    <div class="preview-tools" aria-label="애니메이션 검토 도구">
      <button type="button" data-count="6" class="on">스톤 6개</button>
      <button type="button" data-count="3">스톤 3개</button>
      <button type="button" data-count="2">스톤 2개</button>
      <button type="button" id="replay">처음부터 다시 보기</button>
      <label>응답 <select id="response"><option value="ready">정상</option><option value="slow">생성 지연</option><option value="bridge-error">연결 분석 실패</option><option value="future-error">미래 생성 실패</option></select></label>
    </div>
    <p class="preview-note">애니메이션 확인용 예시입니다. AI 호출과 데이터 저장은 발생하지 않습니다.</p>
    <p class="fu-graph-key">큰 스톤: 성취기준 · 작은 별: 키워드 · 연결선: 소속과 교과 간 관계</p>
    <div id="scene"></div>
    <div id="feedback" role="status"></div>
  </main>
  <script type="module">
    import '/src/pages/futures2.css'
    import { createFuturesScene, startDust, LENS_SHORT } from '/src/lib/futures2Scene.js'

    // 실제 데이터·API를 사용하지 않는 독립적인 동작 검토 화면.
    const examples = [
      { key: 'demo:S1', code: '국어 · 예시 1', subject: '국어', subject_group: '국어', words: ['주장', '근거', '설득'] },
      { key: 'demo:S2', code: '수학 · 예시 2', subject: '수학', subject_group: '수학', words: ['자료', '비율', '분석'] },
      { key: 'demo:S3', code: '과학 · 예시 3', subject: '과학', subject_group: '과학', words: ['환경', '측정', '탐구'] },
      { key: 'demo:S4', code: '사회 · 예시 4', subject: '사회', subject_group: '사회', words: ['지역', '문제', '참여'] },
      { key: 'demo:S5', code: '미술 · 예시 5', subject: '미술', subject_group: '미술', words: ['표현', '메시지', '소통'] },
      { key: 'demo:S6', code: '정보 · 예시 6', subject: '정보', subject_group: '정보', words: ['데이터', '해결', '제작'] },
    ]
    const feedback = document.querySelector('#feedback'), mode = document.querySelector('#response')
    let scene, bridgeTimer, count = 6, generation = 0
    function show() {
      scene?.destroy(); clearTimeout(bridgeTimer); feedback.textContent = ''; const run = ++generation
      const standards = examples.slice(0, count), response = mode.value
      document.querySelectorAll('[data-count]').forEach(b => b.classList.toggle('on', Number(b.dataset.count) === count))
      scene = createFuturesScene(document.querySelector('#scene'), {
        standards,
        requestFuture: (index) => new Promise((resolve, reject) => setTimeout(() => {
          if (response === 'future-error' && index === 0) return reject(new Error('예시 오류: 잠시 후 다시 시도해주세요.'))
          resolve({
            title: ['우리 학교의 내일을 설계하는 학생들', '학교 생활의 작은 불편을 바꾸다', '데이터로 읽는 우리 동네', '도시의 온도를 낮추는 실험', '미래를 그리는 공공 전시', '과거의 선택으로 보는 오늘', '새로운 직업의 하루를 설계하다', '지구의 내일을 위한 공동 제안'][index],
            lens: LENS_SHORT[index], situation: '학생들이 주변의 문제를 발견하고, 서로 다른 교과의 관점과 자료를 연결해 실행 가능한 제안을 만들어 봅니다.',
            driving_question: '우리의 작은 선택은 학교와 지역의 미래를 어떻게 바꿀 수 있을까요?',
            axis: ['자료 분석', '근거 있는 제안', '공동 표현'],
            roles: standards.map((s, i) => ({ ...s, role: ['인터뷰와 근거를 정리합니다.', '설문 자료의 변화를 분석합니다.', '관찰과 측정으로 가설을 확인합니다.', '지역의 이해관계를 살펴봅니다.', '제안을 시각적으로 표현합니다.', '데이터를 도구로 구현합니다.'][i] })),
            activity_steps: ['주변의 변화와 불편을 관찰하고 질문을 고릅니다.', '자료를 모으고 교과의 관점으로 해석합니다.', '대안을 만들고 친구들의 피드백을 반영합니다.'],
            data_sources: ['학교 설문', '주변 관찰 기록'], student_output: '근거와 실행 계획을 담은 공동 제안서', assessment_idea: '근거의 타당성과 교과 관점의 연결을 살펴봅니다.',
            honesty_note: '이 화면은 움직임 검토를 위한 예시이며, 실제 AI 생성 결과가 아닙니다.',
          })
        }, response === 'slow' ? 18000 + index * 180 : 700 + index * 150)),
        onStartProject: () => { feedback.textContent = '프로젝트 시작 동작을 확인했습니다. 미리보기에서는 저장하지 않습니다.' },
        onBasket: () => { feedback.textContent = '성취기준 담기 동작을 확인했습니다. 미리보기에서는 저장하지 않습니다.'; return true },
      })
      bridgeTimer = setTimeout(() => {
        if (run !== generation) return
        scene.setBridges(response === 'bridge-error' ? null : {
          keywords: Object.fromEntries(standards.map(s => [s.key, s.words])),
          concepts: standards.slice(1).map((s, i) => ({ label: ['근거', '자료 분석', '문제 발견', '표현과 참여', '공동 해결'][i], ends: [{ key: standards[i].key, word: standards[i].words[1] }, { key: s.key, word: s.words[0] }], keys: [standards[i].key, s.key], why: '서로 다른 교과의 관점으로 같은 문제를 탐구합니다.' })), isolated: [],
        })
      }, 550)
    }
    document.querySelectorAll('[data-count]').forEach(b => b.addEventListener('click', () => { count = Number(b.dataset.count); show() }))
    document.querySelector('#replay').addEventListener('click', show)
    mode.addEventListener('change', show)
    const stopDust = startDust(document.querySelector('.fu-dust'))
    addEventListener('pagehide', () => { scene?.destroy(); clearTimeout(bridgeTimer); stopDust() }, { once: true })
    show()
  </script>
</body>
</html>
